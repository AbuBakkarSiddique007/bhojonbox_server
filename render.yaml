services:
  - type: web
    name: bhojonbox-server
    env: node
    region: oregon
    branch: main
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run render-build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        value: "<set-in-render-dashboard>"
      - key: JWT_SECRET
        value: "<set-in-render-dashboard>"
      - key: ADMIN_EMAIL
        value: "<set-in-render-dashboard>"
      - key: ADMIN_PASSWORD
        value: "<set-in-render-dashboard>"
      - key: FRONTEND_URL
        value: https://bhojonbox-client.vercel.app
      - key: BASE_URL
        value: https://bhojonbox-server.onrender.com
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        value: "<set-in-render-dashboard>"
      - key: STRIPE_WEBHOOK_SECRET
        value: "<set-in-render-dashboard>"
