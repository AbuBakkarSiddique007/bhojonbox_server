services:
  - type: web
    name: bhojonbox-server
    env: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: "<set-in-render-dashboard>"
        type: secret
      - key: JWT_SECRET
        value: "<set-in-render-dashboard>"
        type: secret
      - key: FRONTEND_URL
        value: https://bhojonbox-client.vercel.app
      - key: BASE_URL
        value: https://bhojonbox-server.onrender.com
      - key: NODE_ENV
        value: productionservices:
  - type: web
    name: bhojonbox-server
    env: node
    region: oregon
    branch: main
    plan: free
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npm start
    healthCheckPath: /healthz
    # Add environment variables in the Render dashboard (DATABASE_URL, JWT_SECRET, etc.)
